[tool.poetry]
name = "bank"
version = "0.1.0"
description = ""
authors = ["student <mojmetri@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
pytest = "^8.3.5"
pytest-cov = "^6.1.0"
black = "^25.1.0"
mypy = "^1.15.0"
flake8 = "^7.2.0"
isort = "^6.0.1"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.black]
line-length = 119
exclude = ".git"

[tool.isort]
profile = "black"
line_length = 119

[tool.mypy]
strict = true
disallow_untyped_defs = true
warn_return_any = true
exclude = "venv"